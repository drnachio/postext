# ──────────────────────────────────────────────────────────────────────────────
# NPM_TOKEN setup (one-time):
#
# 1. Go to https://www.npmjs.com → Avatar → Access Tokens → Generate New Token
#    Select type: "Automation" (bypasses 2FA for CI)
#    A granular token must grant read/write on EVERY package: postext,
#    postext-pdf, postext-folio, postext-citeproc and postext-epub (E403 on
#    publish = the token does not cover that package, E404 = the token
#    expired). A package's first publish needs a token allowed to create
#    packages: one scoped to existing packages only cannot publish a new name.
#    For a new package, before the first release that carries it, either
#    give the token permission to create packages, or publish it once by
#    hand (`cd packages/<name> && pnpm publish --access public` after
#    `pnpm turbo run build --filter=<name>`), then add it to the token
#    (postext-epub went out this way as 0.1.0 with v1.15.0). Publish a new
#    package last: a refused first publish fails the run after the other
#    packages are out and before the version commit, and a re-run then
#    releases every package at the next version (release-version.sh syncs
#    to npm, then bumps).
# 2. Go to https://github.com/drnachio/postext/settings/secrets/actions
#    Click "New repository secret"
#    Name:  NPM_TOKEN
#    Value: the token from step 1
# ──────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    branches: [main]
    # A merge that only touches the workflows or the README is not a release
    paths-ignore: ['.github/**', 'README.md']
  # Manual recovery: re-run a release without a new merge (e.g. after fixing NPM_TOKEN)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest
    # Skip release commits to avoid infinite loops
    if: "!contains(github.event.head_commit.message, 'chore: release')"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Determine bump type from merged PR labels
      - name: Get version bump type
        id: bump
        uses: actions/github-script@v7
        with:
          script: |
            // Find the merged PR for this push
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              sort: 'updated',
              direction: 'desc',
              per_page: 5,
            });

            const mergedPr = prs.find(pr =>
              pr.merge_commit_sha === context.sha && pr.merged_at
            );

            let bump = 'patch';
            if (mergedPr) {
              const labels = mergedPr.labels.map(l => l.name.toLowerCase());
              if (labels.includes('major')) bump = 'major';
              else if (labels.includes('minor')) bump = 'minor';
              core.info(`PR #${mergedPr.number}: labels=[${labels}] → ${bump}`);
            } else {
              core.info('No merged PR found, defaulting to patch');
            }

            core.setOutput('type', bump);

      # Bump versions in package.json (no git tag yet). See the script for
      # the three cases: bump, release a hand-raised version as-is, or sync
      # with npm when a previous run failed to push its bump commit.
      - name: Bump version
        id: version
        run: |
          VERSION=$(.github/scripts/release-version.sh packages/postext postext ${{ steps.bump.outputs.type }} | tee /dev/stderr | tail -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump postext-pdf version
        id: version_pdf
        run: |
          VERSION=$(.github/scripts/release-version.sh packages/postext-pdf postext-pdf ${{ steps.bump.outputs.type }} | tee /dev/stderr | tail -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump postext-folio version
        id: version_folio
        run: |
          VERSION=$(.github/scripts/release-version.sh packages/postext-folio postext-folio ${{ steps.bump.outputs.type }} | tee /dev/stderr | tail -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump postext-citeproc version
        id: version_citeproc
        run: |
          VERSION=$(.github/scripts/release-version.sh packages/postext-citeproc postext-citeproc ${{ steps.bump.outputs.type }} | tee /dev/stderr | tail -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump postext-epub version
        id: version_epub
        run: |
          VERSION=$(.github/scripts/release-version.sh packages/postext-epub postext-epub ${{ steps.bump.outputs.type }} | tee /dev/stderr | tail -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Build & test the packages (postext-pdf, postext-folio,
      # postext-citeproc and postext-epub build against the freshly bumped
      # workspace postext)
      - run: pnpm turbo run build --filter=postext --filter=postext-pdf --filter=postext-folio --filter=postext-citeproc --filter=postext-epub
      - run: pnpm turbo run test --filter=postext --filter=postext-pdf --filter=postext-folio --filter=postext-citeproc --filter=postext-epub

      # Publish to npm
      - name: Publish postext to npm
        working-directory: packages/postext
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish postext-pdf to npm
        working-directory: packages/postext-pdf
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish postext-folio to npm
        working-directory: packages/postext-folio
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish postext-citeproc to npm
        working-directory: packages/postext-citeproc
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Last, the newest package (see the header)
      - name: Publish postext-epub to npm
        working-directory: packages/postext-epub
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The showcase bundles' pagination (`layouts.<locale>.json`) is
      # stamped with the postext version: lay the books out again with the
      # engine just published and commit the files with the release. Never
      # blocks a release: stale files only make visitors' browsers lay the
      # books out themselves.
      - name: Paginate the showcase bundles
        id: layouts
        continue-on-error: true
        timeout-minutes: 45
        run: scripts/presets/ci-layouts.sh

      # Commit version bump, tag, and push
      - name: Commit & tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/postext/package.json packages/postext-pdf/package.json packages/postext-folio/package.json packages/postext-citeproc/package.json packages/postext-epub/package.json
          # The pagination, when the step above wrote and verified all of it
          if [ "${{ steps.layouts.outcome }}" = success ]; then
            git add apps/web/public/presets
          fi
          # Versions raised by hand are already committed: then only tag.
          # "chore: release" is the loop guard on this workflow's `if`
          if git diff --cached --quiet; then
            echo "Manifests already at the released versions — nothing to commit"
          else
            git commit -m "chore: release v${{ steps.version.outputs.version }} (postext-pdf v${{ steps.version_pdf.outputs.version }}, postext-folio v${{ steps.version_folio.outputs.version }}, postext-citeproc v${{ steps.version_citeproc.outputs.version }}, postext-epub v${{ steps.version_epub.outputs.version }})"
          fi
          # Annotated tags: --follow-tags only pushes annotated tags, not lightweight ones
          git tag -a "v${{ steps.version.outputs.version }}" -m "v${{ steps.version.outputs.version }}"
          git tag -a "postext-pdf-v${{ steps.version_pdf.outputs.version }}" -m "postext-pdf v${{ steps.version_pdf.outputs.version }}"
          git tag -a "postext-folio-v${{ steps.version_folio.outputs.version }}" -m "postext-folio v${{ steps.version_folio.outputs.version }}"
          git tag -a "postext-citeproc-v${{ steps.version_citeproc.outputs.version }}" -m "postext-citeproc v${{ steps.version_citeproc.outputs.version }}"
          git tag -a "postext-epub-v${{ steps.version_epub.outputs.version }}" -m "postext-epub v${{ steps.version_epub.outputs.version }}"
          git push origin main --follow-tags

      # Keep develop in sync with the version bump
      - name: Sync version to develop
        run: |
          git fetch origin develop
          git checkout develop
          git merge main --no-edit
          git push origin develop
