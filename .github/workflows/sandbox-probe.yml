name: Sandbox probe

# After a release, every recipe bundle opened in the Sandbox of the
# deployed site (`pnpm cookbook sandbox --site`, #736): the route a reader
# opens from a recipe page, with the layout worker's documents read from
# the page. It fails when an edition does not lay out, raises a warning its
# pen does not, shows another page count than capture.json records, or
# fetched another edition's bundle (#737).
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      site:
        description: The site to probe
        default: https://postext.dev
        required: false

# Read-only token: no job here writes to the repository (artifacts and
# caches use the runner's own token).
permissions:
  contents: read

jobs:
  probe:
    name: Open the recipe bundles on the site
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    # macOS, as the captures: a recipe is captured on a Mac, and Chrome
    # measures text there to fractions of a pixel that Chrome on the Linux
    # runner does not give (the same 55 editions broke a line elsewhere on
    # ubuntu before and after #757, none on macOS).
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      SITE: ${{ inputs.site || 'https://postext.dev' }}

    steps:
      # The released commit: its capture.json files are what the site serves.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The cookbook's scripts import the engine from the workspace.
      - run: pnpm turbo run build --filter=postext

      # The site's pages print the version they were built from (JSON-LD
      # `softwareVersion`): wait until the deploy of this release is live.
      - name: Wait for the deploy
        run: |
          VERSION=$(node -p "require('./packages/postext/package.json').version")
          for _ in $(seq 1 80); do
            if curl -fsSL --max-time 30 "$SITE/en" | grep -q "\"softwareVersion\":\"$VERSION\""; then
              echo "$SITE serves postext $VERSION"
              exit 0
            fi
            sleep 15
          done
          echo "$SITE does not serve postext $VERSION after 20 minutes" >&2
          exit 1

      - name: pnpm cookbook sandbox --site
        env:
          COOKBOOK_CHROME: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: pnpm cookbook sandbox --site "$SITE" --report "$RUNNER_TEMP/sandbox-probe.json"

      # The composed-page bench (#869) on the release just published, which
      # the recipes' pens now import from npm: every check, the longer text
      # and the approved layouts. A layout the release moved warns (C39) and
      # is captured again; anything else that breaks fails here.
      - name: pnpm cookbook bench
        if: always()
        env:
          COOKBOOK_CHROME: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: pnpm cookbook bench --no-pixels --report "$RUNNER_TEMP/cookbook-bench.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-probe
          path: |
            ${{ runner.temp }}/sandbox-probe.json
            ${{ runner.temp }}/cookbook-bench.json
          retention-days: 30
