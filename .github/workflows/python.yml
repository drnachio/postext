name: Python package

# The Python package (packages/postext-python, #1443) on Linux, macOS and
# Windows: its tests run the real executable of the package's version,
# downloaded from that GitHub Release (as `pip install postext` users get
# it), so they need no build of the command line.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - packages/postext-python/**
      - .github/workflows/python.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ["3.13"]
        include:
          - { os: ubuntu-latest, python: "3.9" }
    defaults:
      run:
        working-directory: packages/postext-python
    env:
      POSTEXT_CACHE_DIR: ${{ github.workspace }}/.postext-cache
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packages/postext-python
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - id: version
        shell: bash
        run: echo "version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/postext/_version.py)" >> "$GITHUB_OUTPUT"
      # The 200 MB executable, once per version and system
      - uses: actions/cache@v4
        with:
          path: .postext-cache/bin
          key: postext-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}
      - run: python -m pip install --quiet ".[test]"
      - run: python -m pytest -q -p no:cacheprovider --import-mode=importlib
      - name: Lint and types
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          python -m pip install --quiet ruff mypy
          ruff check src tests
          ruff format --check src tests
          mypy --strict src/postext
