name: Discord feeds

# A closed issue's summary in #github-feed of the Postext Discord, minutes
# after it closes instead of at the next scheduled run of the feeds. The
# script lives in the public drnachio/postext-discord; the bot's
# credentials are the DISCORD_TOKEN and GUILD_ID secrets.
on:
  issues:
    types: [closed]

permissions:
  contents: read

# Issues are often closed in a batch: each closing restarts the wait, so a
# batch ends in one run, which posts every summary at once.
concurrency:
  group: discord-feeds
  cancel-in-progress: true

jobs:
  issues:
    name: Closed issues to Discord
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the rest of the batch
        run: sleep 90
      - uses: actions/checkout@v4
        with:
          repository: drnachio/postext-discord
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Post the summaries
        continue-on-error: true
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node issues.mjs
