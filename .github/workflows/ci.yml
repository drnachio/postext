name: CI

on:
  pull_request:
    branches: [main, develop]
  # main's own status, which the README badge shows
  push:
    branches: [main]

jobs:
  ci:
    name: Build & Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run build

      - run: pnpm turbo run test

      # The command line as a self-contained executable: built for this
      # runner and run with nothing else (the release builds every platform).
      - name: CLI executable
        run: |
          pnpm --filter postext-cli build:bin linux-x64 windows-x64
          sh packages/postext-cli/scripts/smoke.sh packages/postext-cli/bin/postext-linux-x64

      # Windows has needs of its own (Skia's ICU data beside the addon): the
      # cli-windows job runs this executable on a Windows runner.
      - uses: actions/upload-artifact@v4
        with:
          name: postext-cli-windows
          path: packages/postext-cli/bin/postext-windows-x64.exe
          retention-days: 3

      # W3C EPUBCheck on postext-epub's sample books (src/epubcheck.test.ts,
      # skipped by `pnpm test`): fixed and reflowable, with and without a
      # cover, must pass with no errors or warnings. The runner's Java runs
      # the official release.
      - name: EPUBCheck
        run: |
          curl -fsSL -o "$RUNNER_TEMP/epubcheck.zip" https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP/epubcheck"
          JAR=$(find "$RUNNER_TEMP/epubcheck" -name epubcheck.jar | head -1)
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec java -jar "%s" "$@"\n' "$JAR" > "$RUNNER_TEMP/bin/epubcheck"
          chmod +x "$RUNNER_TEMP/bin/epubcheck"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          epubcheck --version
          pnpm --filter postext-epub epubcheck

      - run: pnpm turbo run check-types

      - run: pnpm turbo run lint

  cli-windows:
    name: CLI on Windows
    needs: ci
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packages/postext-cli/scripts
      - uses: actions/download-artifact@v4
        with:
          name: postext-cli-windows
          path: bin
      - name: Smoke test
        shell: bash
        run: sh packages/postext-cli/scripts/smoke.sh bin/postext-windows-x64.exe
